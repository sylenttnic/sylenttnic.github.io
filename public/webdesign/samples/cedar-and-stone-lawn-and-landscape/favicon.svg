  <rect width="64" height="64" rx="8" fill="#A1D55D"/>
  <text x="32" y="43" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700"
        fill="#4A2A1E">GG</text>
</svg>
