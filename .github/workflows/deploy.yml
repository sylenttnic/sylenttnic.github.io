name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          NEXT_PUBLIC_INTAKE_API_KEY: ${{ vars.NEXT_PUBLIC_INTAKE_API_KEY }}
          # The no-presence branch of /webdesign. UNSET or anything but "true"
          # builds the page exactly as it was, with no branch at all. Going live
          # also needs the intake Lambda's SSM webdesign-no-presence-enabled.
          NEXT_PUBLIC_NO_PRESENCE_ENABLED: ${{ vars.NEXT_PUBLIC_NO_PRESENCE_ENABLED }}
      # The sample sites under public/webdesign/samples are static files, so
      # `next build` cannot substitute NEXT_PUBLIC_* into them the way it does
      # for the app. They ship a __INTAKE_API_KEY__ placeholder and get the real
      # value here, from the same repo variable the build above reads. That
      # keeps a rotatable credential out of this public repo's git history.
      #
      # It fails the deploy rather than shipping a dead lead form: empty
      # variable, no placeholder found, or any placeholder surviving are all
      # errors. Absence is not a pass, so the last check proves none survived.
      - name: Inject the intake key into the sample request forms
        env:
          INTAKE_KEY: ${{ vars.NEXT_PUBLIC_INTAKE_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, sys
          key = os.environ.get('INTAKE_KEY', '')
          if not key:
              sys.exit('::error::NEXT_PUBLIC_INTAKE_API_KEY is empty; sample request forms would post an empty key.')
          n = 0
          for f in pathlib.Path('out').rglob('*.html'):
              t = f.read_text(encoding='utf-8')
              if '__INTAKE_API_KEY__' in t:
                  f.write_text(t.replace('__INTAKE_API_KEY__', key), encoding='utf-8')
                  n += 1
          if n == 0:
              sys.exit('::error::no page carries the __INTAKE_API_KEY__ placeholder; the sample forms are not wired.')
          print(f'intake key injected into {n} sample page(s)')
          PY
          if grep -rq '__INTAKE_API_KEY__' out; then
            echo '::error::a __INTAKE_API_KEY__ placeholder survived substitution.' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
